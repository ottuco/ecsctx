name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Explicit Django dimension: 4.2 covers the django>=4.0 floor,
        # 5.2 LTS is what consuming projects run, 6.0 is current.
        # Pairings follow Django's own python support (4.2/5.2: <=3.12 and
        # >=3.10 here; 6.0: >=3.12).
        python-version: ["3.10", "3.12"]
        django-version: ["4.2", "5.2", "6.0"]
        exclude:
          - python-version: "3.10"
            django-version: "6.0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          # uv 0.12.10 (2026-09-04) breaks setup-uv@v5's venv activation: every
          # job dies in the action itself with "Activating python venv..." then
          # exit 2, before a single test runs. Pinned to the last version that
          # works with v5; drop the pin when the action is upgraded to v10.
          version: "0.12.9"
      - run: uv sync --group test --extra django
      # The pip install overrides the lock's Django; every later step MUST
      # use --no-sync (a plain `uv run` or second `uv sync` re-syncs the
      # venv to the lock and silently reverts the matrix pin).
      - run: uv pip install "Django~=${{ matrix.django-version }}.0"
      - run: uv run --no-sync pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          version: "0.12.9"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
