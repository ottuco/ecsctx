name: CI

on:
  push:
    branches: [main]
  # Every PR, not only those into main, so a stacked PR is tested before its
  # base merges.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to a PR cancels its superseded run. A push gets a group of its own
# (run_id), so pushes to main never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Explicit Django dimension: 4.2 covers the django>=4.0 floor,
        # 5.2 LTS is what consuming projects run, 6.0 is current.
        # Pairings follow Django's own python support (4.2/5.2: <=3.12 and
        # >=3.10 here; 6.0: >=3.12).
        python-version: ["3.10", "3.12"]
        django-version: ["4.2", "5.2", "6.0"]
        exclude:
          - python-version: "3.10"
            django-version: "6.0"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group test --extra django
      # The pip install overrides the lock's Django; every later step MUST
      # use --no-sync (a plain `uv run` or second `uv sync` re-syncs the
      # venv to the lock and silently reverts the matrix pin).
      - run: uv pip install "Django~=${{ matrix.django-version }}.0"
      - run: uv run --no-sync pytest tests/ -v

  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
