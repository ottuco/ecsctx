name: CI

on:
  push:
    branches: [main]
  # Every PR, not only those into main, so a stacked PR is tested before its
  # base merges.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to a PR cancels its superseded run. A push gets a group of its own
# (run_id), so pushes to main never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      matrix:
        # Explicit Django dimension: 4.2 covers the django>=4.0 floor,
        # 5.2 LTS is what consuming projects run, 6.0 is current.
        # Pairings follow Django's own python support (4.2/5.2: <=3.12 and
        # >=3.10 here; 6.0: >=3.12).
        python-version: ["3.10", "3.12"]
        django-version: ["4.2", "5.2", "6.0"]
        exclude:
          - python-version: "3.10"
            django-version: "6.0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - run: uv sync --group test --extra django
      # The pip install overrides the lock's Django; every later step MUST
      # use --no-sync (a plain `uv run` or second `uv sync` re-syncs the
      # venv to the lock and silently reverts the matrix pin).
      # DRF is resolved with it: the lock's DRF 3.18 needs Django 5.2. The
      # Python 3.10 + Django 4.2 job runs the django extra's floor, DRF 3.15.2
      # (what event_backend runs); every other job takes the newest DRF its
      # Django allows (3.17.x on 4.2).
      - env:
          DJANGO_VERSION: ${{ matrix.django-version }}
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          drf="djangorestframework>=3.15.2"
          if [ "$PYTHON_VERSION" = "3.10" ] && [ "$DJANGO_VERSION" = "4.2" ]; then
            drf="djangorestframework==3.15.2"
          fi
          uv pip install "Django~=${DJANGO_VERSION}.0" "$drf" --upgrade-package djangorestframework
      - run: uv pip check
      - run: uv run --no-sync pytest tests/ -v

  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          activate-environment: true
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
