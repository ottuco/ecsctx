name: Release

# A release reaches main through a pull request, like every other change (RUL-SD-001, #160284):
# 1. Run this workflow by hand on main with the bump type. It bumps the version, writes the
#    CHANGELOG entry, runs the tests and opens the pull request "release: vX.Y.Z".
# 2. Approve and merge that pull request. On the push to main, a version with no tag yet is
#    built, tested, tagged, released on GitHub and published to PyPI.
# PyPI's trusted publisher names this file and the `pypi` environment: keep both.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Calculate new version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current=$(python -c "import re; print(re.search(r'version = \"(.+?)\"', open('pyproject.toml').read()).group(1))")
          IFS='.' read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new="${major}.${minor}.${patch}"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Bump version in pyproject.toml and __init__.py
        run: |
          sed -i "s/version = \"${{ steps.version.outputs.current }}\"/version = \"${{ steps.version.outputs.new }}\"/" pyproject.toml
          sed -i "s/__version__ = \"${{ steps.version.outputs.current }}\"/__version__ = \"${{ steps.version.outputs.new }}\"/" ecsctx/__init__.py

      - name: Generate CHANGELOG entry
        run: |
          NEW_VERSION="v${{ steps.version.outputs.new }}"
          DATE=$(date +%Y-%m-%d)

          # Find previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          # Collect commits grouped by type
          FEATURES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^feat" 2>/dev/null || true)
          FIXES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^fix" 2>/dev/null || true)
          OTHER=$(git log "$RANGE" --pretty=format:"- %s (%h)" --invert-grep --grep="^feat" --grep="^fix" --grep="^release:" --all-match 2>/dev/null || true)

          # Build entry
          ENTRY="## ${NEW_VERSION} (${DATE})"$'\n'
          [ -n "$FEATURES" ] && ENTRY+=$'\n'"### Features"$'\n'"${FEATURES}"$'\n'
          [ -n "$FIXES" ] && ENTRY+=$'\n'"### Fixes"$'\n'"${FIXES}"$'\n'
          [ -n "$OTHER" ] && ENTRY+=$'\n'"### Other"$'\n'"${OTHER}"$'\n'

          # Prepend to CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            # Insert after the first line (header)
            {
              head -n 1 CHANGELOG.md
              echo ""
              echo "$ENTRY"
              tail -n +2 CHANGELOG.md
            } > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md
          else
            {
              echo "# Changelog"
              echo ""
              echo "$ENTRY"
            } > CHANGELOG.md
          fi

      - name: Run tests
        run: |
          uv sync --group test --extra django
          uv run pytest tests/ -v

      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.version.outputs.new }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v${NEW}"
          git add pyproject.toml ecsctx/__init__.py CHANGELOG.md
          git commit -m "release: v${NEW}"
          git push origin "release/v${NEW}"
          gh pr create --base main --head "release/v${NEW}" --title "release: v${NEW}" \
            --body "Version ${NEW} and its CHANGELOG entry. Merging this pull request publishes v${NEW} to PyPI."

  # On every push to main: is the version in pyproject.toml already released (tagged)?
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the version
        id: version
        run: |
          version=$(python3 -c "import re; print(re.search(r'version = \"(.+?)\"', open('pyproject.toml').read()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    concurrency: release-publish
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build
        run: uv build

      - name: Run tests
        run: |
          uv sync --group test --extra django
          uv run pytest tests/ -v

      - name: Tag
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --title "v${VERSION}" \
            --generate-notes

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
