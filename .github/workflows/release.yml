name: Release

# A release reaches main through a pull request, like every other change (RUL-SD-001, #160284):
# 1. Run this workflow by hand on main with the bump type. It bumps the version, writes the
#    CHANGELOG entry, runs the tests and pushes the branch release/vX.Y.Z; open the pull
#    request "release: vX.Y.Z" from the link in the run's summary.
# 2. Approve and merge that pull request. On the push to main, a version with no tag yet is
#    built, tested, tagged, released on GitHub and published to PyPI.
# PyPI's trusted publisher names this file and the `pypi` environment: keep both.
#
# Build and test code (uv, hatchling, pytest and the test dependencies) runs only in jobs with
# a read-only token and no stored git credentials. The jobs that can write (push a branch or a
# tag, create the GitHub release) or publish (OIDC id-token in the `pypi` environment) run no
# build or test code: they only take the files the earlier job uploaded (#161532).
# Test code also never runs in a job that uploads files: the tests have jobs of their own
# (prepare-test, test), and the later jobs download the uploads by artifact id, not by name.
# Every job can delete and re-upload this run's artifacts, but a re-upload gets a new id, so
# a replaced upload makes the release fail instead of shipping the new files.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      new: ${{ steps.version.outputs.new }}
      files-id: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate new version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current=$(python3 -c "import re; print(re.search(r'version = \"(.+?)\"', open('pyproject.toml').read()).group(1))")
          IFS='.' read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new="${major}.${minor}.${patch}"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Bump version in pyproject.toml and __init__.py
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEW: ${{ steps.version.outputs.new }}
        run: |
          sed -i "s/version = \"${CURRENT}\"/version = \"${NEW}\"/" pyproject.toml
          sed -i "s/__version__ = \"${CURRENT}\"/__version__ = \"${NEW}\"/" ecsctx/__init__.py

      - name: Generate CHANGELOG entry
        env:
          NEW: ${{ steps.version.outputs.new }}
        run: |
          NEW_VERSION="v${NEW}"
          DATE=$(date +%Y-%m-%d)

          # Find previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi

          # Collect commits grouped by type
          FEATURES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^feat" 2>/dev/null || true)
          FIXES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="^fix" 2>/dev/null || true)
          OTHER=$(git log "$RANGE" --pretty=format:"- %s (%h)" --invert-grep --grep="^feat" --grep="^fix" --grep="^release:" --all-match 2>/dev/null || true)

          # Build entry
          ENTRY="## ${NEW_VERSION} (${DATE})"$'\n'
          [ -n "$FEATURES" ] && ENTRY+=$'\n'"### Features"$'\n'"${FEATURES}"$'\n'
          [ -n "$FIXES" ] && ENTRY+=$'\n'"### Fixes"$'\n'"${FIXES}"$'\n'
          [ -n "$OTHER" ] && ENTRY+=$'\n'"### Other"$'\n'"${OTHER}"$'\n'

          # Prepend to CHANGELOG.md
          if [ -f CHANGELOG.md ]; then
            # Insert after the first line (header)
            {
              head -n 1 CHANGELOG.md
              echo ""
              echo "$ENTRY"
              tail -n +2 CHANGELOG.md
            } > CHANGELOG.tmp
            mv CHANGELOG.tmp CHANGELOG.md
          else
            {
              echo "# Changelog"
              echo ""
              echo "$ENTRY"
            } > CHANGELOG.md
          fi

      # Nothing runs after this upload in this job.
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            pyproject.toml
            ecsctx/__init__.py
            CHANGELOG.md
          if-no-files-found: error
          retention-days: 1

  # The tests, on main with the bumped files, in a job that uploads nothing.
  prepare-test:
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.files-id }}
          path: .

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          activate-environment: true

      # --frozen installs exactly the hash-pinned versions in uv.lock and never re-resolves.
      - name: Run tests
        run: |
          uv sync --frozen --group test --extra django
          uv run --no-sync pytest tests/ -v

  # Only git runs here: no build or test code next to the contents: write token.
  release-branch:
    needs: [prepare, prepare-test]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # This job runs only git after the checkout (no build or test code) and uploads nothing;
      # the push needs the checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true # zizmor: ignore[artipacked] see the comment above

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.prepare.outputs.files-id }}
          path: .

      # Workflows may not open or approve pull requests in this organisation (#160364), so a
      # person opens it from the link below, and someone else approves it.
      - name: Push the release branch
        env:
          NEW: ${{ needs.prepare.outputs.new }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v${NEW}"
          git add pyproject.toml ecsctx/__init__.py CHANGELOG.md
          git commit -m "release: v${NEW}"
          git push origin "release/v${NEW}"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...release/v${NEW}?expand=1&title=release:%20v${NEW}"
          echo "Open the release pull request: ${url}"
          echo "### Open the release pull request: [release: v${NEW}](${url})" >> "$GITHUB_STEP_SUMMARY"

  # On every push to main: is the version in pyproject.toml already released (tagged)?
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the version
        id: version
        run: |
          version=$(python3 -c "import re; print(re.search(r'version = \"(.+?)\"', open('pyproject.toml').read()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  # Build with a read-only token; the next jobs only use the uploaded dist/.
  build:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      dist-id: ${{ steps.upload.outputs.artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          activate-environment: true

      - name: Build
        run: uv build

      # Nothing runs after this upload in this job.
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # The tests, in a job that uploads nothing.
  test:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          activate-environment: true

      # --frozen installs exactly the hash-pinned versions in uv.lock and never re-resolves.
      - name: Run tests
        run: |
          uv sync --frozen --group test --extra django
          uv run --no-sync pytest tests/ -v

  # Only git and gh run here: no build or test code next to the contents: write token.
  release:
    needs: [check, build, test]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency: release-publish
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      # This job runs only git and gh after the checkout (no build or test code) and uploads
      # nothing; the Tag step pushes with the checkout credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] see the comment above

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.dist-id }}
          path: dist/

      - name: Tag
        run: |
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --title "v${VERSION}" \
            --generate-notes

  # The only job with the PyPI OIDC token: no checkout, no build or test code, only the
  # dist/ that the build job made.
  publish:
    needs: [build, release]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.dist-id }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
